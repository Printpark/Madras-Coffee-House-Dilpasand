<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madras Coffee House</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#FDE7E8 url("background.png");
    background-repeat:repeat;
    background-size:300px;
    padding:15px;
}

.card{
    width:90%;
    max-width:390px;
    background:#fff;
    margin:35px auto;
    border-radius:28px;
    padding:30px;
    box-shadow:0 18px 40px rgba(135,55,55,.15);
}

h1{
    text-align:center;
    font-size:34px;
    color:#4A2C2A;
    margin-bottom:22px;
    letter-spacing:.6px;
}

.product{
    text-align:center;
    font-size:27px;
    font-weight:700;
    color:#6F4E37;
    margin:20px 0 28px;
    letter-spacing:.5px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    padding:20px 0;
    border-bottom:1px solid #F1E4E4;
}

.label{
    flex:1;
    font-size:18px;
    font-weight:600;
    color:#444;
}

.value{
    flex:1;
    text-align:right;
    font-size:18px;
    color:#333;
    line-height:1.5;
    word-break:break-word;
}

.price-value{
    color:#8B4513;
    font-size:23px;
    font-weight:700;
}

</style>

</head>

<body>

<div class="card">

<h1>Madras Coffee House</h1>

<div class="row">
    <span class="label">FSSAI No.</span>
    <span class="value">10026912000258</span>
</div>

<div class="product">
    Dilpasand
</div>

<div class="row">
    <span class="label">Price</span>
    <span class="value price-value">₹30</span>
</div>

<div class="row">
    <span class="label">Quantity</span>
    <span class="value">100 g</span>
</div>

<div class="row">
    <span class="label">Best Before</span>
    <span class="value" id="expiryDate"></span>
</div>

</div>

<script>

const expiryDate = new Date();
expiryDate.setDate(expiryDate.getDate() + 30);

const options = {
    day: "2-digit",
    month: "short",
    year: "numeric"
};

document.getElementById("expiryDate").textContent =
expiryDate.toLocaleDateString("en-IN", options);

</script>

</body>
</html>
