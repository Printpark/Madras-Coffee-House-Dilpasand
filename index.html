<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karupatti House</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;

    /* Very light crimson background */
    background:#fff8f8;

    /* Premium gold coffee bean pattern */
    background-image:
    radial-gradient(circle at 25px 25px, rgba(212,175,55,.12) 2px, transparent 3px),
    radial-gradient(circle at 65px 65px, rgba(212,175,55,.12) 2px, transparent 3px),
    radial-gradient(ellipse 10px 16px at 40px 40px, rgba(212,175,55,.08) 45%, transparent 46%),
    radial-gradient(ellipse 10px 16px at 80px 80px, rgba(212,175,55,.08) 45%, transparent 46%);

    background-size:120px 120px;
}

.card{
    width:90%;
    max-width:380px;
    background:#ffffff;
    margin:40px auto;
    border-radius:22px;
    padding:28px;
    box-shadow:0 10px 25px rgba(0,0,0,.10);
}

h1{
    text-align:center;
    font-size:32px;
    color:#4e342e;
    margin-bottom:20px;
}

.product{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#2e7d32;
    margin:18px 0 25px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    padding:18px 0;
    border-bottom:1px solid #ececec;
}

.label{
    font-size:18px;
    font-weight:bold;
    color:#444;
    flex:1;
}

.value{
    font-size:18px;
    color:#333;
    flex:1;
    text-align:right;
    line-height:1.5;
    word-break:break-word;
}

.price-value{
    color:#2e7d32;
    font-weight:bold;
    font-size:20px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#999;
    font-size:14px;
}

</style>

</head>

<body>

<div class="card">

<h1>Karupatti House</h1>

<div class="row">
    <span class="label">FSSAI No.</span>
    <span class="value">12421026000977</span>
</div>

<div class="product">
    Tirunelveli Halwa
</div>

<div class="row">
    <span class="label">Price</span>
    <span class="value price-value">₹45</span>
</div>

<div class="row">
    <span class="label">Quantity</span>
    <span class="value">100g</span>
</div>

<div class="row">
    <span class="label">Validity</span>
    <span class="value">30 Days from MFG Date</span>
</div>

<div class="row">
    <span class="label">Ingredients</span>
    <span class="value">
        Wheat, Ghee, Cashew, Sugar &amp; Refined Oil
    </span>
</div>

<div class="footer">
    Crafted with ❤️ by Karupatti House
</div>

</div>

</body>
</html>
